<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>내신 영어 학습</title>
    <!-- 홈 화면에 추가했을 때 주소창 없는 앱처럼 열리게 하는 설정 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="내신영어" />

    <!-- 제목·숫자용 서체(Playfair Display, Noto Serif KR). 불러오지 못하면 기본 세리프로 대체됨 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet" />
    <!-- react-native-web 권장 스타일 초기화 -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }

        display: flex;
        height: 100%;
        flex: 1;
      }
